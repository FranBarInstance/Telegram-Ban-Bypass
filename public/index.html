<html>

    <meta name="theme-color" content="#229ED9">
    <meta name="application-name" content="Telegram Ban Bypass" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" href="favicon.ico" type="image/ico">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="https://telegram.org/js/telegram-widget.js?22" as="script">
    <script>
        (function () {
            var known = ['es', 'en', 'ru', 'pt', 'de', 'fr', 'it', 'pl', 'nl'];
            var lang = '';
            try {
                lang = sessionStorage.getItem('preferredLanguage') ||
                       localStorage.getItem('preferredLanguage') || '';
            } catch (e) { /* storage unavailable */ }
            if (known.indexOf(lang) < 0) {
                lang = (navigator.language || 'en').split('-')[0];
                if (known.indexOf(lang) < 0) lang = 'en';
            }
            document.documentElement.lang = lang;
        })();
        try {
            // Read the stored theme preference before the stylesheet loads
            // to avoid a flash of the wrong theme. Absent value = system.
            var savedTheme = sessionStorage.getItem('tgTheme') || localStorage.getItem('tgTheme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) { /* storage unavailable */ }
    </script>
    <title>Telegram Ban Bypass - Avoid blocking the Telegram channel or group</title>
    <style>
:root {
    color-scheme: light;
    --bg: #eef2f6;
    --bg-gradient: linear-gradient(180deg, #e7f3fb 0%, #eef2f6 240px);
    --surface: #ffffff;
    --surface-soft: #f4f7fa;
    --text: #1c2733;
    --text-soft: #5b6b7b;
    --border: #dce4ec;
    --accent: #229ED9;
    --accent-strong: #1685bd;
    --accent-soft: #e3f2fb;
    --danger: #d9534f;
    --danger-soft: #fdecec;
    --note-bg: #fff6dd;
    --note-border: #e6b93c;
    --note-text: #7a5d10;
    --ok-bg: #e2f4e7;
    --ok-text: #1e6b34;
    --success: #2fae5f;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16, 34, 53, 0.08), 0 4px 14px rgba(16, 34, 53, 0.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
/* Explicit user choice from the theme toggle */
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1621;
    --bg-gradient: linear-gradient(180deg, #17212b 0%, #0e1621 240px);
    --surface: #17212b;
    --surface-soft: #1d2a38;
    --text: #e9eef4;
    --text-soft: #9fb0c0;
    --border: #2b3a4a;
    --accent: #229ED9;
    --accent-strong: #3fb0e6;
    --accent-soft: #1b3247;
    --danger: #e0716d;
    --danger-soft: #3a2324;
    --note-bg: #33301f;
    --note-border: #a8892e;
    --note-text: #e8d49a;
    --ok-bg: #1e3527;
    --ok-text: #8fd6a4;
    --success: #43bd72;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0e1621;
        --bg-gradient: linear-gradient(180deg, #17212b 0%, #0e1621 240px);
        --surface: #17212b;
        --surface-soft: #1d2a38;
        --text: #e9eef4;
        --text-soft: #9fb0c0;
        --border: #2b3a4a;
        --accent: #229ED9;
        --accent-strong: #3fb0e6;
        --accent-soft: #1b3247;
        --danger: #e0716d;
        --danger-soft: #3a2324;
        --note-bg: #33301f;
        --note-border: #a8892e;
        --note-text: #e8d49a;
        --ok-bg: #1e3527;
        --ok-text: #8fd6a4;
        --success: #43bd72;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    }
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 16px;
    font-family: var(--font);
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
}
main {
    max-width: 620px;
    margin: 0 auto;
}
.toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(16, 34, 53, 0.06);
    margin: -16px -16px 0;
    padding: 0 16px;
}
.toolbar-inner {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 52px;
}
.brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 36px;
    height: 36px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: border-color 0.15s ease, color 0.15s ease;
}
.brand:hover,
.brand:focus {
    outline: none;
    border-color: var(--accent);
    color: var(--accent);
}
.toolbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.toolbar-channel {
    /* Takes all the room left by the toolbar icons; the ellipsis
       only kicks in when the name actually collides with them */
    flex: 1;
    min-width: 0;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.lang-wrap {
    position: relative;
    flex: none;
}
.lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 150px;
    max-height: 60vh;
    overflow-y: auto;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 20;
}
.lang-menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9em;
    text-align: left;
    white-space: nowrap;
    color: var(--text);
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.lang-menu button:hover {
    background: var(--accent-soft);
    color: var(--accent);
}
.lang-menu button.is-active {
    color: var(--accent);
    font-weight: 700;
}
.lang-menu button.is-active::after {
    content: "\2713";
}
.theme-toggle,
.lang-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 36px;
    height: 36px;
    padding: 0;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
}
.theme-toggle:hover,
.theme-toggle:focus,
.lang-toggle:hover,
.lang-toggle:focus {
    outline: none;
    border-color: var(--accent);
    color: var(--accent);
}
.theme-toggle .icon-moon {
    display: none;
}
.theme-toggle.is-dark .icon-sun {
    display: none;
}
.theme-toggle.is-dark .icon-moon {
    display: block;
}
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin: 14px 0;
}
.input-card label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}
.input-card input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
}
.input-card input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.prefs {
    margin-top: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-soft);
}
.prefs summary {
    padding: 11px 14px;
    font-weight: 600;
    color: var(--text-soft);
    cursor: pointer;
    list-style: none;
}
.prefs summary::before {
    content: "▸ ";
    color: var(--accent);
}
.prefs[open] summary::before {
    content: "▾ ";
}
.prefs .pref-row,
.prefs .pref-autocheck-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    font-size: 0.95em;
    color: var(--text);
    cursor: pointer;
}
.prefs .pref-check {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 0.95em;
}
.prefs input[type="checkbox"],
.prefs input[type="radio"] {
    accent-color: var(--success);
    width: 16px;
    height: 16px;
    cursor: pointer;
}
.pref-autocheck-row,
.pref-startid-row,
.pref-deepcheck-row {
    flex-wrap: wrap;
    cursor: default;
}
.autocheck-interval,
.startid-value,
.deepcheck-max {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    font-size: 0.9em;
    color: var(--text-soft);
}
.autocheck-interval input,
.startid-value input,
.deepcheck-max input {
    padding: 6px 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
}
.autocheck-interval input {
    width: 70px;
}
.deepcheck-max input {
    width: 70px;
}
.startid-value input {
    width: 95px;
}
.autocheck-interval input:disabled,
.startid-value input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.channel-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}
.channel-row input[type="text"] {
    flex: 1;
    min-width: 0;
    margin-bottom: 0;
}
.widget-load-more-button {
    display: block;
    width: 100%;
    padding: 13px 16px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.load-channel-btn {
    flex: none;
    width: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.widget-load-more-button:hover {
    background: var(--accent-strong);
}
.load-channel-btn:hover {
    background: var(--accent-strong);
}
.load-channel-btn:disabled {
    background: var(--border);
    color: var(--text-soft);
    cursor: not-allowed;
}
.widget-load-more-button {
    margin: 18px 0;
    background: var(--surface);
    color: var(--accent);
    border: 1px solid var(--accent);
}
.button-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin: 18px 0;
}
.button-row .widget-load-more-button {
    flex: 1;
    min-width: 0;
    width: auto;
    margin: 0;
}
.scroll-arrow-btn {
    flex: none;
    width: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: inherit;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.scroll-arrow-btn:hover {
    background: var(--accent-soft);
}
#check-new-row {
    margin-bottom: 12px;
}
.widget-load-more-button:hover {
    background: var(--accent-soft);
}
.widget-load-more-button:disabled {
    opacity: 0.6;
    cursor: default;
}
.stop-search-btn {
    display: block;
    width: 100%;
    margin: 12px 0 18px;
    padding: 13px 16px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    color: #ffffff;
    background: var(--danger);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.stop-search-btn:hover {
    filter: brightness(0.92);
}
.stop-search-btn:disabled {
    opacity: 0.6;
    cursor: default;
}
.research-btn {
    display: block;
    width: 100%;
    margin: 0 0 70px;
    padding: 11px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.research-btn:hover {
    background: var(--accent-soft);
}
#saved-channels-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
#saved-channels-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
}
#saved-channels-list li:last-child {
    border-bottom: none;
}
#saved-channels-list li span {
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
    overflow-wrap: anywhere;
}
#saved-channels-list li span:hover {
    text-decoration: underline;
}
#saved-channels-list button {
    flex-shrink: 0;
    min-height: 40px;
    min-width: 44px;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--text-soft);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
}
#saved-channels-list button:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: var(--danger-soft);
}
.current-channel {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
    margin: 14px 0;
    overflow-wrap: anywhere;
}
.current-channel.flash-ok {
    background: var(--ok-bg);
    color: var(--ok-text);
}
.loading {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-style: italic;
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    margin: 14px 0;
}
.error {
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    color: var(--danger);
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    margin: 14px 0;
}
#widget-container {
    margin-top: 14px;
}
iframe[src*="t.me"] {
    margin-bottom: 10px;
    border-radius: 8px;
    max-width: 100%;
}
.tips h3 {
    margin: 0 0 10px;
    font-size: 1.15em;
    color: var(--accent);
}
.tips p {
    margin: 0 0 14px;
    color: var(--text-soft);
}
.search-info {
    background: var(--note-bg);
    border-left: 4px solid var(--note-border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
}
.search-info p {
    margin: 0;
    color: var(--note-text);
    font-size: 0.95em;
}
/* Numbered strategies under the intro paragraph; the extra class level
   keeps the .tips checkmark styling (✓, 26px pad) away from them */
.search-info ol {
    margin: 10px 0 12px;
    padding-left: 22px;
}
.search-info ol li {
    margin: 0 0 6px;
    padding-left: 0;
    color: var(--note-text);
    font-size: 0.95em;
}
.search-info ol li::before {
    content: none;
}
.tips ul {
    list-style: none;
    padding: 0;
    margin: 0 0 14px;
}
.tips li {
    position: relative;
    padding: 3px 0 3px 26px;
    margin-bottom: 8px;
    color: var(--text-soft);
    font-size: 0.95em;
}
.tips li::before {
    content: "\2713";
    position: absolute;
    left: 2px;
    color: var(--accent);
    font-weight: 700;
}
.github-link {
    text-align: center;
    font-size: 0.9em;
}
.github-link a {
    color: var(--accent);
}
@media (min-width: 1000px) {
    main {
        max-width: 1024px;
        display: flex;
        flex-direction: row-reverse;
        align-items: flex-start;
        gap: 20px;
    }
    .toolbar-inner {
        max-width: 1024px;
    }
    .content {
        flex: 0 0 540px;
        min-width: 0;
    }
    .sidebar {
        flex: 1;
        min-width: 0;
        position: sticky;
        top: 67px;
    }
}
@media (max-width: 600px) {
    body {
        padding: 10px;
    }
    .toolbar {
        margin: -10px -10px 0;
        padding: 0 10px;
    }
    .toolbar-inner {
        min-height: 48px;
    }
    .toolbar-right {
        gap: 8px;
    }
    .card {
        padding: 16px;
        margin: 10px 0;
    }
}
    </style>
</head>

                return Math.min(value, CONFIG.DEEP_CHECK_MAX_LIMIT);
            },
            extractChannelName(input) {
                const cleanInput = input.trim();

                if (cleanInput.includes('t.me/')) {
                    const parts = cleanInput.split('/');
                    name = parts[parts.length - 1] || parts[parts.length - 2];
                }
                if (name.startsWith('@')) {
                    name = name.substring(1);
                }

            },
            setLoadingState(isLoading, message = 'Loading...') {
                state.isLoading = isLoading;
                elements.loading.textContent = message;
                elements.loading.style.display = isLoading ? 'block' : 'none';
            },
            showError(message) {
                elements.error.textContent = message;
                elements.error.style.display = 'block';
                elements.loading.style.display = 'none';
            },
            clearContainer() {
                elements.widgetContainer.innerHTML = '';
                elements.loadMoreRow.style.display = 'none';
                elements.checkNewRow.style.display = 'none';
                elements.reSearchBtn.style.display = 'none';
                autoCheck.stop();
                elements.currentChannel.style.display = 'none';
                // Back to the app name: the toolbar slot doubles as a brand
                // placeholder while no channel is being viewed
                elements.toolbarChannel.textContent = 'TGBanBypass';
                elements.toolbarChannel.style.display = '';
            },
            createTestElement() {
                const testContainer = document.createElement('div');
                Object.assign(testContainer.style, {
                    position: 'absolute',
                    left: '-9999px',
                    visibility: 'hidden'

                document.body.appendChild(testContainer);

            },
            saveChannel(channelName) {
                const savedChannels = JSON.parse(storage.getItem('telegramSavedChannels') || '[]');
                if (!savedChannels.includes(channelName)) {
                    savedChannels.push(channelName);
                    storage.setItem('telegramSavedChannels', JSON.stringify(savedChannels));
                    return true;
                }

            },
            // The stored ID is the highest one ever found: it never goes back
            saveLastId(channelName, lastPostId) {
                const key = CONFIG.LAST_ID_KEY_PREFIX + channelName;
                const stored = parseInt(storage.getItem(key), 10) || 0;
                if (lastPostId > stored) {
                    storage.setItem(key, String(lastPostId));
                }
            },
            loadSavedChannels() {
                return JSON.parse(storage.getItem('telegramSavedChannels') || '[]');
            },
            removeChannel(channelName) {
                let savedChannels = utils.loadSavedChannels();

            },
            displaySavedChannels() {

                const savedChannelsContainer = document.querySelector('.saved-channels');
                if (savedChannels.length > 0) {
                    listContainer.innerHTML = '';
                    savedChannels.forEach(channel => {
                        const li = document.createElement('li');
                        const span = document.createElement('span');

                        span.textContent = `@${channel}`;
                        const removeButton = document.createElement('button');
                        removeButton.className = 'remove-channel';
                        removeButton.dataset.channel = channel;

                        li.appendChild(removeButton);
                        listContainer.appendChild(li);

                    savedChannelsContainer.style.display = 'none';
                }
            },
            // Start IDs live in storage (session or persistent per the opt-in),
            // one entry per channel; an empty value means "auto" and clears it
            saveChannelStartId(channelName, startId) {
                const key = CONFIG.START_ID_KEY_PREFIX + channelName;
                if (startId === null || startId === undefined || String(startId).trim() === '') {
                    storage.removeItem(key);
                } else {
                    storage.setItem(key, String(startId).trim());
                }
            },
            getChannelStartId(channelName) {
                return storage.getItem(CONFIG.START_ID_KEY_PREFIX + channelName) || null;
            },
            loadChannelStartId(channelName) {
                const savedStartId = utils.getChannelStartId(channelName);
                elements.startIdInput.value = savedStartId || '';
                return savedStartId;
            },
            loadCurrentChannelStartId() {
                const channelName = utils.extractChannelName(elements.channelInput.value);
                if (channelName) {
                    return utils.loadChannelStartId(channelName);
                }
                elements.startIdInput.value = '';
                return null;
            }
        };
        const messageChecker = {
            // Resolves { exists, certain }. A false is only "certain" when the
            // embed rendered the "post not found" page (thin iframe). A false
            // from a throttled embed (default ~150 px, never resized) or a
            // network failure is ambiguous: the post may exist, so callers
            // that cannot afford false negatives (the channel search) retry it.
            probe(channelName, messageId) {
                return new Promise((resolve) => {
                    const testContainer = utils.createTestElement();
                    let isResolved = false;
                    let pageLoaded = false;
                    let pageLoadedAt = 0;
                    let lastHeight = -1;
                    let stableCount = 0;
                    let fastTimer = null;
                    const cleanup = () => {
                        if (!isResolved) {
                            isResolved = true;
                            clearTimeout(fastTimer);
                            clearTimeout(timeout);
                            testContainer.remove();
                        }
                    };
                    const resolveWith = (result) => {
                        if (!isResolved) {
                            cleanup();
                            resolve(result);
                        }
                    };
                    const timeout = setTimeout(() => resolveWith({ exists: false, certain: false }), CONFIG.TIMEOUT_DURATION);
                    const script = document.createElement('script');
                    script.async = true;
                    script.src = CONFIG.WIDGET_SCRIPT_URL;
                    script.setAttribute('data-telegram-post', `${channelName}/${messageId}`);
                    script.setAttribute('data-width', '100%');
                    // Poll the iframe height every ~50 ms and resolve as soon
                    // as the answer is clear. The iframe starts at its default
                    // ~150 px and the embed resizes it once, so any height
                    // outside 145-155 after the page loaded is already final:
                    //   >160 / 60-144 -> the embed resized: the post exists
                    //   0 < h < 60    -> "post not found" page: does not exist
                    //   145-155       -> still the default size (throttled or
                    //                     missing embed): give up after a
                    //                     stable period or a deadline
                    const poll = () => {
                        if (isResolved) return;
                        const iframe = testContainer.querySelector('iframe');
                        const height = iframe ? iframe.offsetHeight : 0;
                        if (height === lastHeight) {
                            stableCount++;
                        } else {
                            stableCount = 0;
                            lastHeight = height;
                        }
                        if (height > 160) {
                            resolveWith({ exists: true, certain: true });
                            return;
                        }
                        if (pageLoaded) {
                            if (height > 0 && height < CONFIG.MIN_IFRAME_HEIGHT) {
                                resolveWith({ exists: false, certain: true });
                                return;
                            }
                            if (height >= 145 && height <= 155) {
                                // Default (throttled) widget size: no resize
                                // has arrived. Give up once it has been stable
                                // for a while, or once a deadline after load
                                // passed, so a fluctuating height does not sit
                                // until the full timeout. The answer is
                                // ambiguous: the post may exist but its embed
                                // was throttled.
                                if (stableCount >= CONFIG.PROBE_BAND_STABLE_SAMPLES ||
                                    Date.now() - pageLoadedAt >= CONFIG.PROBE_BAND_TIMEOUT) {
                                    resolveWith({ exists: false, certain: false });
                                    return;
                                }
                            } else if (height >= CONFIG.MIN_IFRAME_HEIGHT) {
                                resolveWith({ exists: true, certain: true });
                                return;
                            }
                        }
                        fastTimer = setTimeout(poll, CONFIG.PROBE_POLL_INTERVAL);
                    };
                    script.onload = () => {
                        const iframe = testContainer.querySelector('iframe');
                        if (iframe) {
                            iframe.onload = () => {
                                pageLoaded = true;
                                pageLoadedAt = Date.now();
                            };
                            fastTimer = setTimeout(poll, CONFIG.PROBE_POLL_INTERVAL);
                        } else {
                            // No iframe at all: the widget deduplicates by DOM
                            // id, so this only happens when the post is
                            // already rendered elsewhere in the page
                            resolveWith({ exists: false, certain: true });
                        }
                    };
                    script.onerror = () => resolveWith({ exists: false, certain: false });
                    testContainer.appendChild(script);
                });
            },
            async checkExists(channelName, messageId) {
                return (await messageChecker.probe(channelName, messageId)).exists;
            }
        };
        // Gap-tolerant last-message search. Deleted messages break the
        // monotonic assumption of a plain binary search, so this works in
        // passes of decreasing resolution: a probe grid to find an anchor, a
        // sweep upward in 100k steps to bracket the top region (crossing
        // deletion gaps via a consecutive-failure streak limit), refinement
        // passes at 10k/1k/100/10, and a final resolution-1 scan around the
        // result. Probes run in parallel batches of SEARCH_PARALLEL.
        const autoSearch = {
            gridValues: [
                80, 100, 120,
                980, 1000, 1020,
                9980, 10000, 10020,
                19980, 20000, 20020,
                39980, 40000, 40020,
                59980, 60000, 60020,
                79980, 80000, 80020,
                99980, 100000, 100020,
                499980, 500000, 500020,
                999980, 1000000, 1000020
            ],
            stopRequested: false,
            // Every search loop calls this so the Stop button aborts within
            // one batch; findLastPost distinguishes the stop from real errors
            checkStop() {
                if (autoSearch.stopRequested) {
                    throw new Error(t.searchStopped);
                }
            },
            updateInfo(message) {
                elements.currentChannel.textContent = message;
                elements.currentChannel.style.display = 'block';
            },
            // A false from a throttled embed is ambiguous, and the streak
            // logic cannot afford false negatives: retry every uncertain
            // false once before counting it as a failure.
            async checkBatch(channelName, ids) {
                const results = await Promise.all(ids.map(id => messageChecker.probe(channelName, id)));
                const uncertain = [];
                results.forEach((r, j) => {
                    if (!r.exists && !r.certain) uncertain.push(j);
                });
                if (uncertain.length) {
                    const retries = await Promise.all(uncertain.map(j => messageChecker.probe(channelName, ids[j])));
                    retries.forEach((r, i) => {
                        results[uncertain[i]] = r;
                    });
                }
                return results.map(r => r.exists);
            },
            async findAnchor(channelName) {
                const grid = autoSearch.gridValues;
                for (let i = 0; i < grid.length; i += CONFIG.SEARCH_PARALLEL) {
                    autoSearch.checkStop();
                    const batch = grid.slice(i, i + CONFIG.SEARCH_PARALLEL);
                    autoSearch.updateInfo(`${t.testingMessage} ${batch[0]}-${batch[batch.length - 1]}...`);
                    const results = await autoSearch.checkBatch(channelName, batch);
                    for (let j = batch.length - 1; j >= 0; j--) {
                        if (results[j]) return batch[j];
                    }
                }
                // The grid's smallest probe is 80: channels whose newest post
                // predates it need a fallback. Scan downward from 79 so the
                // first hit is already the highest existing ID; a binary
                // search here would assume monotonic existence and could miss
                // posts behind small deletion gaps. Only empty channels and
                // tiny channels pay the extra probes.
                for (let base = grid[0] - 1; base >= 1; base -= CONFIG.SEARCH_PARALLEL) {
                    autoSearch.checkStop();
                    const ids = [];
                    for (let k = 0; k < CONFIG.SEARCH_PARALLEL; k++) {
                        if (base - k >= 1) ids.push(base - k);
                    }
                    autoSearch.updateInfo(`${t.testingMessage} ${ids[ids.length - 1]}-${ids[0]}...`);
                    const results = await autoSearch.checkBatch(channelName, ids);
                    for (let j = 0; j < ids.length; j++) {
                        if (results[j]) return ids[j];
                    }
                }
                return 0;
            },
            // maxId caps the sweep. The re-search fallback passes the dead
            // saved ID so it never re-probes the region already discarded.
            // offset shifts every probe of the pass by the same amount below
            // one step: the uniform spacing (and with it the guarantee that
            // a block wider than the step cannot hide between probes) is
            // preserved, but the probes land elsewhere
            async sweepUp(channelName, anchor, maxId = CONFIG.SEARCH_MAX_ID, offset = 0) {
                const step = CONFIG.SEARCH_GRID_STEP;
                let highest = anchor;
                let fails = 0;
                let probed = false;
                for (let base = anchor + step + offset; base <= maxId; base += step * CONFIG.SEARCH_PARALLEL) {
                    probed = true;
                    autoSearch.checkStop();
                    const ids = [];
                    for (let k = 0; k < CONFIG.SEARCH_PARALLEL; k++) {
                        const id = base + k * step;
                        if (id <= maxId) ids.push(id);
                    }
                    autoSearch.updateInfo(`${t.testingMessage} ${ids[0]}-${ids[ids.length - 1]}...`);
                    const results = await autoSearch.checkBatch(channelName, ids);
                    ids.forEach((id, j) => {
                        if (results[j]) {
                            highest = id;
                            fails = 0;
                        } else if (highest > 0) {
                            fails++;
                        }
                    });
                    if (highest > 0 && fails >= CONFIG.SEARCH_GAP_STREAK) {
                        return { highest, upper: ids[ids.length - 1] };
                    }
                }
                // Posts still existed at the sweep ceiling: the channel extends
                // beyond it. With the standard ceiling refinement cannot
                // bracket it, so report it as too large instead of returning
                // a silently wrong ID; a custom, lower ceiling is not a size
                // verdict and lets the caller keep the bracket. Zero probes
                // run (anchor already within one step of the ceiling) is
                // "unknown", never "too large": capped needs at least one
                // probe, or a re-search near SEARCH_MAX_ID would error out
                // instead of settling the top from the saved anchor.
                return { highest, upper: maxId, capped: fails === 0 && probed };
            },
            // When the first refinement pass proved the channel sparse, the
            // 1k pass escalates its tolerance once (x3) at its failure streak
            // instead of giving up: on purged channels the first big gap sits
            // right above the last dense block, and stopping there would
            // strand every post beyond it. Dense channels never set the flag,
            // so their probe cost is unchanged.
            async refineLevel(channelName, highest, upper, step, escalateAtStreak = false, offset = 0) {
                let streak = CONFIG.SEARCH_GAP_STREAK;
                let escalated = false;
                let fails = 0;
                let passHits = 0;
                let passMisses = 0;
                let lastProbed = highest;
                for (let base = highest + step + offset; base <= upper; base += step * CONFIG.SEARCH_PARALLEL) {
                    autoSearch.checkStop();
                    const ids = [];
                    for (let k = 0; k < CONFIG.SEARCH_PARALLEL; k++) {
                        const id = base + k * step;
                        if (id <= upper) ids.push(id);
                    }
                    if (!ids.length) break;
                    autoSearch.updateInfo(`${t.testingMessage} ${ids[0]}-${ids[ids.length - 1]}...`);
                    const results = await autoSearch.checkBatch(channelName, ids);
                    ids.forEach((id, j) => {
                        lastProbed = id;
                        if (results[j]) {
                            passHits++;
                            highest = id;
                            fails = 0;
                        } else {
                            passMisses++;
                            fails++;
                        }
                    });
                    if (fails >= streak) {
                        const canEscalate = escalateAtStreak &&
                            !escalated &&
                            base + step * CONFIG.SEARCH_PARALLEL <= upper;
                        if (canEscalate) {
                            streak *= CONFIG.SEARCH_STREAK_ESCALATION;
                            escalated = true;
                        } else {
                            break;
                        }
                    }
                }
                return {
                    highest,
                    upper: fails >= CONFIG.SEARCH_GAP_STREAK ? lastProbed : upper,
                    hits: passHits,
                    misses: passMisses
                };
            },
            // If the resolution-1 scan finds a hit after a run of misses the
            // top of the channel is sparse: escalate the streak once (x3)
            // instead of stopping at the first 100-miss gap. Dense channels
            // never cross a gap here, so they pay nothing extra.
            async finalScan(channelName, highest) {
                let streak = CONFIG.SEARCH_FINAL_STREAK;
                let escalated = false;
                let fails = 0;
                let pendingMisses = 0;
                const limit = highest + CONFIG.SEARCH_FINAL_WINDOW;
                for (let base = highest + 1; base <= limit; base += CONFIG.SEARCH_PARALLEL) {
                    autoSearch.checkStop();
                    const ids = [];
                    for (let k = 0; k < CONFIG.SEARCH_PARALLEL; k++) {
                        if (base + k <= limit) ids.push(base + k);
                    }
                    autoSearch.updateInfo(`${t.testingMessage} ${ids[0]}-${ids[ids.length - 1]}...`);
                    const results = await autoSearch.checkBatch(channelName, ids);
                    ids.forEach((id, j) => {
                        if (results[j]) {
                            if (pendingMisses > 0 && !escalated) {
                                streak *= CONFIG.SEARCH_STREAK_ESCALATION;
                                escalated = true;
                            }
                            pendingMisses = 0;
                            highest = id;
                            fails = 0;
                        } else {
                            pendingMisses++;
                            fails++;
                        }
                    });
                    if (fails >= streak) break;
                }
                return highest;
            },
            // Shared pipeline above a starting bracket: the coarse sweep
            // when no upper bound is known yet, the refinement passes and
            // the resolution-1 scan. st carries the verified bracket in and
            // out (highest = existing ID, upper = bracket above it) so a
            // Stop mid-pipeline can save the progress from the caller.
            // maxId caps the sweep for callers that already discarded the
            // region above it. With randomize, every pass gets a fresh
            // random probe offset: a retry must not replay the positions of
            // the failed attempt, or it fails identically — the whole point
            // of clicking again is to sample different IDs.
            async searchCore(channelName, st, maxId = CONFIG.SEARCH_MAX_ID, randomize = false) {
                const jitter = (step) => randomize ? Math.floor(Math.random() * step) : 0;
                if (st.upper === 0) {
                    const sweep = await autoSearch.sweepUp(channelName, st.highest, maxId, jitter(CONFIG.SEARCH_GRID_STEP));
                    st.highest = sweep.highest;
                    if (sweep.capped && maxId >= CONFIG.SEARCH_MAX_ID) {
                        // A non-existent or private channel renders a preview
                        // page instead of "post not found", so every probe
                        // looks tall and the sweep runs to the ceiling. Probe
                        // an ID no real channel can have: if it also "exists",
                        // the channel itself does not.
                        const sentinelId = CONFIG.SEARCH_MAX_ID + 97000000;
                        const sentinel = await messageChecker.checkExists(channelName, sentinelId);
                        throw new Error(sentinel ? t.channelProbablyMissing : t.channelTooLarge);
                    }
                    st.upper = sweep.upper;
                    autoSearch.updateInfo(`${t.rangeFound} ${st.highest} - ${st.upper}. ${t.startingAutoSearch}`);
                }
                let sparse = false;
                for (const step of CONFIG.SEARCH_LEVELS) {
                    // The 10k pass doubles as a sparsity measurement:
                    // real hits but more misses than hits means the
                    // channel is heavily purged, and the 1k pass must then
                    // escalate past its first gap instead of giving up
                    const refined = await autoSearch.refineLevel(
                        channelName, st.highest, st.upper, step,
                        step === 1000 && sparse,
                        jitter(step)
                    );
                    st.highest = refined.highest;
                    st.upper = refined.upper;
                    if (step === CONFIG.SEARCH_LEVELS[0]) {
                        const total = refined.hits + refined.misses;
                        sparse = refined.hits > 0 && refined.misses > total / 2;
                    }
                }
                autoSearch.updateInfo(`${t.verifyingLastMessage} ${st.highest}`);
                autoSearch.checkStop();
                return await autoSearch.finalScan(channelName, st.highest);
            },
            // Contiguous downward scan from fromId: the first existing ID
            // found is the highest message below fromId. Contiguity is what
            // makes it exact — no live block between fromId and the hit can
            // be skipped — and the batch loop reuses the search-grade
            // probes (ambiguous answers are retried). Returns 0 when the
            // window is exhausted.
            async descendFrom(channelName, fromId, window) {
                // Inclusive floor: exactly `window` IDs get probed, from
                // fromId - window up to fromId - 1 (message IDs start at 1,
                // so 0 is never probed)
                const floor = Math.max(1, fromId - window);
                for (let base = fromId - 1; base >= floor; base -= CONFIG.SEARCH_PARALLEL) {
                    autoSearch.checkStop();
                    const ids = [];
                    for (let k = 0; k < CONFIG.SEARCH_PARALLEL && base - k >= floor; k++) {
                        ids.push(base - k);
                    }
                    autoSearch.updateInfo(`${t.testingMessage} ${ids[ids.length - 1]}-${ids[0]}...`);
                    const results = await autoSearch.checkBatch(channelName, ids);
                    // ids descend, so the first hit in order is the highest
                    for (let j = 0; j < ids.length; j++) {
                        if (results[j]) return ids[j];
                    }
                }
                return 0;
            },
            async findLastPost(channelName, maxId = CONFIG.SEARCH_MAX_ID, randomize = false) {
                autoSearch.stopRequested = false;
                elements.stopSearchBtn.disabled = false;
                elements.stopSearchBtn.style.display = 'block';
                // Highest ID verified so far and the bracket above it: on
                // Stop they become the progress the next search resumes from
                const st = { highest: 0, upper: 0 };
                const progressKey = CONFIG.SEARCH_PROGRESS_KEY + channelName;
                try {
                    utils.setLoadingState(true, t.startingAutoSearch);
                    const progressParts = (storage.getItem(progressKey) || '').split('|');
                    const progressHighest = parseInt(progressParts[0], 10);
                    const progressUpper = parseInt(progressParts[1], 10);
                    if (progressHighest > 0) {
                        // A stopped search left a verified partial top:
                        // continue from it instead of starting over. If the
                        // bracket above it was already found, skip the sweep
                        autoSearch.updateInfo(`${t.resumingProgress} ${progressHighest}`);
                        st.highest = progressHighest;
                        st.upper = Number.isFinite(progressUpper) && progressUpper > st.highest ? progressUpper : 0;
                    } else {
                        const savedId = parseInt(storage.getItem(CONFIG.LAST_ID_KEY_PREFIX + channelName), 10);
                        if (savedId > 0) {
                            // Resume exactly where the user left off, without any
                            // probe: "check new" catches up with what was published
                            // after that ID
                            autoSearch.displayResult(channelName, savedId);
                            return;
                        }
                        autoSearch.updateInfo(t.searchingInitialRange);
                        const anchor = await autoSearch.findAnchor(channelName);
                        if (anchor === 0) {
                            throw new Error(t.noValidMessages);
                        }
                        st.highest = anchor;
                        // An anchor above the cap falsifies the cap's premise
                        // (nothing exists above the dead saved ID): the hit
                        // is verified live evidence, so search from it
                        // uncapped, with the sentinel active again
                        if (anchor > maxId) {
                            maxId = CONFIG.SEARCH_MAX_ID;
                        }
                    }
                    const lastPostId = await autoSearch.searchCore(channelName, st, maxId, randomize);
                    storage.removeItem(progressKey);
                    autoSearch.displayResult(channelName, lastPostId);
                } catch (error) {
                    if (autoSearch.stopRequested) {
                        // An intentional Stop is not an error: report it as
                        // progress and leave the channel unselected. The
                        // verified partial top is stored so the next search
                        // of this channel continues from it
                        if (st.highest > 0) {
                            storage.setItem(progressKey,
                                st.upper > st.highest ? `${st.highest}|${st.upper}` : String(st.highest));
                            autoSearch.updateInfo(`${t.searchStopped}. ${t.progressSaved} ${st.highest}`);
                        } else {
                            autoSearch.updateInfo(t.searchStopped);
                        }
                        elements.loadChannelBtn.disabled = false;
                        utils.setLoadingState(false);
                    } else {
                        // A finished (even if failed) search invalidates any
                        // leftover partial progress
                        storage.removeItem(progressKey);
                        console.error('Error in auto search:', error);
                        utils.showError(`Error in auto search: ${error.message}`);
                        elements.loadChannelBtn.disabled = false;
                        utils.setLoadingState(false);
                    }
                } finally {
                    elements.stopSearchBtn.style.display = 'none';
                }
            },
            // Re-check anchored at the saved last ID. That ID existed once,
            // so unless messages were deleted the channel's last message is
            // at least that high: search upward from it (phase 1). Only when
            // nothing above it is found is the saved ID itself probed: alive
            // means it still is the last message; dead means a purge lowered
            // the top, so the stale key is dropped — saveLastId keeps the max
            // and would block the correction — and the search continues
            // downward from it (phase 2). A deletion wider than the descent
            // window falls back to the from-zero search with its sweep
            // capped below the dead saved ID; the anchor grid may still
            // probe a few points inside the discarded region — a hit there
            // is verified evidence above the dead ID and drops the cap.
            // Every run draws fresh random probe offsets: someone clicking
            // "Search again" is unhappy with the current result, so an
            // identical retry would be a waste — each click must sample
            // different IDs and get a new chance at crossing what the
            // previous one missed.

                const ids = [...container.querySelectorAll('iframe[src*="t.me"]')]
                    .map(iframe => {
                        const match = (iframe.getAttribute('src') || '').match(/t\.me\/[^/]+\/(\d+)/);
                        return match ? Number(match[1]) : null;
                    })
                    .filter(id => id !== null)
                    .sort((a, b) => a - b);
                if (!ids.length) return;
                const wasAtBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 80;
                container.innerHTML = '';
                const fragment = document.createDocumentFragment();
                for (const id of ids) {
                    fragment.appendChild(widgetLoader.createScript(id));
                }
                container.appendChild(fragment);
                iframeMonitor.start();
                if (wasAtBottom) autoScroller.start();
            },
            init() {
                theme.apply();
                if (theme.query) {
                    theme.query.addEventListener('change', () => {
                        // Only in auto mode: follow the system theme
                        if (!theme.preferred()) {
                            theme.apply();
                            theme.refreshEmbeds();
                        }
                    });
                }
            }
        };
        const eventListeners = {
            init() {
                i18n.updateUITexts();
                updateLanguageSelector();
                window.addEventListener('telegramLoaded', () => {
                    if (elements.widgetContainer && state.lastPostId > 0) {
                        // Render exactly up to lastPostId: telegram-widget.js
                        // deduplicates embeds by post ID, so any rendered ID
                        // above lastPostId would make the "check new" probes
                        // (lastPostId+1…) silently resolve to false
                        widgetLoader.load(state.lastPostId);
                        elements.checkNewRow.style.display = 'flex';
                        // Land at the newest message (bottom), like a chat:
                        // scroll almost immediately, then re-adjust as iframes load
                        autoScroller.start();
                        autoCheck.start();
                    }
                });
                elements.checkNewButton.addEventListener('click', () => newMessages.check(true));
                // Jump helpers: down from the "load older" row to the newest
                // message, up from the "check new" row back to the oldest
                elements.scrollDownBtn.addEventListener('click', () => {
                    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
                });
                elements.scrollUpBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                elements.stopSearchBtn.addEventListener('click', () => {
                    if (!autoSearch.stopRequested) {
                        autoSearch.stopRequested = true;
                        elements.stopSearchBtn.disabled = true;
                    }
                });
                elements.reSearchBtn.addEventListener('click', async () => {
                    if (state.isLoading || !state.currentChannel) return;
                    // Re-check anchored at the saved last ID when there is
                    // one: it existed once, so the last message is at least
                    // that high unless posts were deleted. The partial
                    // progress of a stopped search is the untrusted state
                    // and is dropped; without a saved ID this stays a plain
                    // from-zero search
                    storage.removeItem(CONFIG.SEARCH_PROGRESS_KEY + state.currentChannel);
                    const savedId = parseInt(storage.getItem(CONFIG.LAST_ID_KEY_PREFIX + state.currentChannel), 10);
                    utils.clearContainer();
                    elements.tipsCard.style.display = 'none';
                    elements.loadChannelBtn.disabled = true;
                    elements.error.style.display = 'none';
                    try {
                        if (savedId > 0) {
                            await autoSearch.reSearch(state.currentChannel, savedId);
                        } else {
                            await autoSearch.findLastPost(state.currentChannel, CONFIG.SEARCH_MAX_ID, true);
                        }
                    } catch (error) {
                        console.error('Error in re-search:', error);
                        utils.showError(error.message);
                    } finally {
                        elements.loadChannelBtn.disabled = false;
                    }
                });
                elements.themeToggle.addEventListener('click', () => theme.toggle());
                // Language menu: the globe toggles the dropdown; choosing a
                // language, clicking outside or pressing Escape closes it
                const setLangMenu = (open) => {
                    elements.langMenu.hidden = !open;
                    elements.langToggle.setAttribute('aria-expanded', String(open));
                };
                elements.langToggle.addEventListener('click', () => {
                    setLangMenu(elements.langMenu.hidden);
                });
                elements.langMenu.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-lang]');
                    if (!btn) return;
                    changeLanguage(btn.dataset.lang);
                    setLangMenu(false);
                });
                document.addEventListener('click', (e) => {
                    if (!elements.langMenu.hidden && !e.target.closest('.lang-wrap')) {
                        setLangMenu(false);
                    }
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') setLangMenu(false);
                });
                document.getElementById('pref-cookies').addEventListener('change', (e) => {
                    storage.setPersistent(e.target.checked);
                    // Reflect the real state: with storage disabled (Firefox
                    // blocking all cookies) nothing is saved and the checkbox
                    // must snap back instead of lying
                    e.target.checked = storage.isPersistent();
                });
                document.getElementById('pref-autocheck').addEventListener('change', (e) => {
                    storage.setItem(CONFIG.AUTOCHECK_ENABLED_KEY, e.target.checked ? '1' : '0');
                    autoCheck.start();
                });
                document.getElementById('autocheck-interval').addEventListener('change', (e) => {
                    const value = Math.max(CONFIG.AUTOCHECK_MIN_SECONDS,
                                           parseInt(e.target.value, 10) || CONFIG.AUTOCHECK_MIN_SECONDS);
                    e.target.value = value;
                    storage.setItem(CONFIG.AUTOCHECK_INTERVAL_KEY, String(value));
                    autoCheck.start();
                });
                document.getElementById('pref-deepcheck').addEventListener('change', (e) => {
                    storage.setItem(CONFIG.DEEP_CHECK_ENABLED_KEY, e.target.checked ? '1' : '0');
                });
                document.getElementById('deepcheck-max').addEventListener('change', (e) => {
                    const value = Math.min(CONFIG.DEEP_CHECK_MAX_LIMIT,
                        Math.max(1, parseInt(e.target.value, 10) || CONFIG.DEEP_CHECK_MAX));
                    e.target.value = value;
                    storage.setItem(CONFIG.DEEP_CHECK_MAX_KEY, String(value));
                    i18n.updateUITexts();
                });
                elements.startIdCheckbox.addEventListener('change', () => {
                    const on = elements.startIdCheckbox.checked;
                    storage.setItem(CONFIG.START_ID_ENABLED_KEY, on ? '1' : '0');
                    elements.startIdInput.disabled = !on;
                    if (on) {
                        utils.loadCurrentChannelStartId();
                    }
                });
                elements.startIdInput.addEventListener('change', () => {
                    const channelName = utils.extractChannelName(elements.channelInput.value);
                    if (channelName) {
                        utils.saveChannelStartId(channelName, elements.startIdInput.value);
                    }
                });
                elements.channelInput.addEventListener('input', () => {
                    utils.loadCurrentChannelStartId();
                });
                elements.loadChannelBtn.addEventListener('click', async () => {
                    const channelName = utils.extractChannelName(elements.channelInput.value);
                    if (!channelName) {
                        alert(t.invalidChannel);
                        return;
                    }
                    if (state.isLoading) return;
                    // Start ID checked = manual search from that ID; unchecked = automatic
                    const useManual = elements.startIdCheckbox.checked;
                    const startId = elements.startIdInput.value.trim();
                    if (useManual && startId === '') {
                        alert(t.startIdRequired);
                        return;
                    }
                    if (useManual) {
                        utils.saveChannelStartId(channelName, startId);
                    }
                    utils.clearContainer();
                    elements.tipsCard.style.display = 'none';
                    elements.loadChannelBtn.disabled = true;
                    elements.error.style.display = 'none';
                    try {
                        if (useManual) {
                            await manualSearch.findLastPost(channelName, startId);
                        } else {
                            await autoSearch.findLastPost(channelName);
                        }
                        if (utils.saveChannel(channelName)) {
                            utils.displaySavedChannels();
                        }
                    } catch (error) {
                        console.error('Error loading channel:', error);
                        utils.showError(error.message);
                    } finally {
                        elements.loadChannelBtn.disabled = false;
                    }
                });
                document.addEventListener('DOMContentLoaded', () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const channelParam = urlParams.get('channel');
                    if (channelParam) {
                        elements.channelInput.value = channelParam;
                        // Programmatic assignment does not fire 'input', so
                        // fill the saved Start ID for this channel explicitly
                        utils.loadCurrentChannelStartId();
                    }
                    utils.addChannelsFromURL();
                    utils.displaySavedChannels();
                });
                utils.addChannelsFromURL = function () {
                    const urlParams = new URLSearchParams(window.location.search);
                    const channelsToAdd = urlParams.get('add');
                    if (channelsToAdd) {
                        const channelsArray = channelsToAdd
                            .split(',')
                            .map(ch => utils.extractChannelName(ch))
                            .filter(ch => ch);
                        let addedAny = false;
                        channelsArray.forEach(channel => {
                            if (utils.saveChannel(channel)) {
                                addedAny = true;
                            }
                        });
                        if (addedAny) {
                            utils.displaySavedChannels();
                        }
                    }
                };
                elements.channelInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        elements.loadChannelBtn.click();
                    }
                });
                // Restore saved preferences
                document.getElementById('pref-cookies').checked = storage.isPersistent();
                const startIdOn = storage.getItem(CONFIG.START_ID_ENABLED_KEY) === '1';
                elements.startIdCheckbox.checked = startIdOn;
                elements.startIdInput.disabled = !startIdOn;
                utils.loadCurrentChannelStartId();
                document.getElementById('pref-autocheck').checked =
                    storage.getItem(CONFIG.AUTOCHECK_ENABLED_KEY) === '1';
                const savedInterval = parseInt(storage.getItem(CONFIG.AUTOCHECK_INTERVAL_KEY), 10);
                document.getElementById('autocheck-interval').value =
                    Number.isFinite(savedInterval) ?
                        Math.max(CONFIG.AUTOCHECK_MIN_SECONDS, savedInterval) :
                        CONFIG.AUTOCHECK_DEFAULT_SECONDS;
                document.getElementById('pref-deepcheck').checked =
                    storage.getItem(CONFIG.DEEP_CHECK_ENABLED_KEY) === '1';
                const savedDeepMax = parseInt(storage.getItem(CONFIG.DEEP_CHECK_MAX_KEY), 10);
                document.getElementById('deepcheck-max').value =
                    Number.isFinite(savedDeepMax) && savedDeepMax >= 1 && savedDeepMax <= CONFIG.DEEP_CHECK_MAX_LIMIT ?
                        savedDeepMax : CONFIG.DEEP_CHECK_MAX;
                // The tip/info texts quote the limit, so refresh them once
                // the saved value is in the input
                i18n.updateUITexts();
                theme.init();
            }
        };
        eventListeners.init();
        if ('serviceWorker' in navigator) {
            // A service worker is no longer required for PWA installability;
            // unregister any leftover registration from older versions so the
            // app runs without one
            navigator.serviceWorker.getRegistrations().then((registrations) => {
                registrations.forEach((registration) => registration.unregister());
            });
        }
    </script>
</body>
