<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Allows you to skip the ban of any telegram channel or group. You can read the messages of a channel without appearing in the history, no one knows if you have read it.">
    <meta name="author" content="github.com/FranBarInstance">
    <meta name="theme-color" content="#229ED9">
    <meta name="application-name" content="Telegram Ban Bypass" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" href="favicon.ico" type="image/ico">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="https://telegram.org/js/telegram-widget.js?22" as="script">
    <script>
        document.documentElement.lang = (navigator.language || navigator.userLanguage).startsWith('es') ? 'es' : 'en';
    </script>
    <title>Telegram Ban Bypass - Avoid blocking the Telegram channel or group</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-inner">
            <a class="brand" href="https://github.com/FranBarInstance/Telegram-Ban-Bypass" target="_blank" rel="noopener">TGBypass</a>
            <div class="toolbar-right">
                <span id="toolbar-channel" class="toolbar-channel" style="display: none;"></span>
                <select id="lang-select" class="language-selector" aria-label="Language" onchange="changeLanguage(this.value)">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </header>
    <main>
        <aside class="sidebar">
            <section class="card input-card">
                <label for="channel-input" id="enterChannelLabel"></label>
                <input type="text" id="channel-input" placeholder="e.g., telegram or https://t.me/telegram/">
                <div class="controls-row">
                    <div class="method-selection" role="radiogroup">
                        <label class="method-option">
                            <input type="radio" id="method-auto" name="method" value="auto" checked>
                            <span id="byAutoLabel"></span>
                        </label>
                        <label class="method-option">
                            <input type="radio" id="method-manual" name="method" value="manual">
                            <span id="byManualLabel"></span>
                        </label>
                    </div>
                    <button type="button" id="load-channel-btn" class="load-channel-btn"></button>
                </div>
                <div class="start-id-container" id="start-id-container">
                    <label for="start-id-input">Start ID</label>
                    <div class="start-id-wrapper">
                        <input type="number" id="start-id-input" placeholder="Start ID">
                        <button type="button" id="save-cookie-btn" class="save-cookie-btn"></button>
                    </div>
                </div>
            </section>
            <section class="card saved-channels" style="display: none;">
                <ul id="saved-channels-list"></ul>
            </section>
        </aside>
        <div class="content">
            <div id="current-channel" class="current-channel" style="display: none;"></div>
            <button class="widget-load-more-button" style="display: none;" id="loadMoreBtn"></button>
            <div id="widget-container"></div>
            <button class="widget-load-more-button" style="display: none;" id="checkNewBtn"></button>
            <div id="loading" class="loading" style="display: none;"></div>
            <div id="error" class="error" style="display: none;"></div>
            <section class="card tips" id="tips-card">
                <h3 id="quickGuideTitle"></h3>
                <p id="quickGuideDescription"></p>
                <div class="search-info" id="searchInfo">
                    <p id="searchInfoText"></p>
                </div>
                <ul id="featuresList"></ul>
                <p class="github-link">GitHub: <a href="https://github.com/FranBarInstance/Telegram-Ban-Bypass" target="_blank">Telegram Ban Bypass</a></p>
            </section>
        </div>
    </main>
    <div class="for-caching" style="display: none;">
        <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-post="telegram/0" data-width="100%"></script>
    </div>
    <script src="app.js"></script>
</body>
</html>
