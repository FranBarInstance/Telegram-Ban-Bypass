<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Allows you to skip the ban of any telegram channel or group. You can read the messages of a channel without appearing in the history, no one knows if you have read it.">
    <meta name="author" content="github.com/FranBarInstance">
    <meta name="theme-color" content="#229ED9">
    <meta name="application-name" content="Telegram Ban Bypass" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" href="favicon.ico" type="image/ico">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="https://telegram.org/js/telegram-widget.js?22" as="script">
    <script>
        (function () {
            var known = ['es', 'en', 'ru', 'pt', 'de', 'fr', 'it', 'pl', 'nl'];
            var lang = '';
            try {
                lang = sessionStorage.getItem('preferredLanguage') ||
                       localStorage.getItem('preferredLanguage') || '';
            } catch (e) { /* storage unavailable */ }
            if (known.indexOf(lang) < 0) {
                lang = (navigator.language || 'en').split('-')[0];
                if (known.indexOf(lang) < 0) lang = 'en';
            }
            document.documentElement.lang = lang;
        })();
        try {
            // Read the stored theme preference before the stylesheet loads
            // to avoid a flash of the wrong theme. Absent value = system.
            var savedTheme = sessionStorage.getItem('tgTheme') || localStorage.getItem('tgTheme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) { /* storage unavailable */ }
    </script>
    <title>Telegram Ban Bypass - Avoid blocking the Telegram channel or group</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-inner">
            <span id="toolbar-channel" class="toolbar-channel">TGBanBypass</span>
            <div class="toolbar-right">
                <a class="brand" href="https://github.com/FranBarInstance/Telegram-Ban-Bypass" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
                    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                    </svg>
                </button>
                <div class="lang-wrap">
                    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Language" aria-haspopup="true" aria-expanded="false">
                        <svg class="icon-globe" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M2 12h20"></path>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                    </button>
                    <ul id="lang-menu" class="lang-menu" hidden>
                        <li><button type="button" data-lang="es">Español</button></li>
                        <li><button type="button" data-lang="en">English</button></li>
                        <li><button type="button" data-lang="ru">Русский</button></li>
                        <li><button type="button" data-lang="pt">Português</button></li>
                        <li><button type="button" data-lang="de">Deutsch</button></li>
                        <li><button type="button" data-lang="fr">Français</button></li>
                        <li><button type="button" data-lang="it">Italiano</button></li>
                        <li><button type="button" data-lang="pl">Polski</button></li>
                        <li><button type="button" data-lang="nl">Nederlands</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <main>
        <aside class="sidebar">
            <section class="card input-card">
                <div class="channel-row">
                    <input type="text" id="channel-input" placeholder="e.g., telegram or https://t.me/telegram/">
                    <button type="button" id="load-channel-btn" class="load-channel-btn" title="Load" aria-label="Load">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                            <path d="M2 21 23 12 2 3v7l15 2-15 2v7z"/>
                        </svg>
                    </button>
                </div>
                <details class="prefs">
                    <summary id="prefsTitle"></summary>
                    <label class="pref-row">
                        <input type="checkbox" id="pref-cookies">
                        <span id="prefCookiesLabel"></span>
                    </label>
                    <div class="pref-row pref-startid-row">
                        <label class="pref-check">
                            <input type="checkbox" id="pref-startid">
                            <span id="prefStartIdLabel"></span>
                        </label>
                        <div class="startid-value">
                            <input type="number" id="start-id-input" min="1" disabled>
                        </div>
                    </div>
                    <div class="pref-row pref-autocheck-row">
                        <label class="pref-check">
                            <input type="checkbox" id="pref-autocheck">
                            <span id="prefAutoCheckLabel"></span>
                        </label>
                        <div class="autocheck-interval">
                            <input type="number" id="autocheck-interval" min="10" step="5" value="60">
                            <span id="secondsLabel"></span>
                        </div>
                    </div>
                    <div class="pref-row pref-deepcheck-row">
                        <label class="pref-check">
                            <input type="checkbox" id="pref-deepcheck">
                            <span id="prefDeepCheckLabel"></span>
                        </label>
                        <div class="deepcheck-max">
                            <input type="number" id="deepcheck-max" min="1" max="1000" step="1" value="100">
                            <span id="deepCheckMaxLabel"></span>
                        </div>
                    </div>
                </details>
            </section>
            <section class="card saved-channels" style="display: none;">
                <ul id="saved-channels-list"></ul>
            </section>
        </aside>
        <div class="content">
            <div id="current-channel" class="current-channel" style="display: none;"></div>
            <button type="button" class="stop-search-btn" id="stop-search-btn" style="display: none;"></button>
            <div class="button-row" id="load-more-row" style="display: none;">
                <button class="widget-load-more-button" id="loadMoreBtn"></button>
                <button type="button" id="scroll-down-btn" class="scroll-arrow-btn" aria-label="Scroll down" title="Scroll down">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12l7 7 7-7"></path>
                    </svg>
                </button>
            </div>
            <div id="widget-container"></div>
            <div class="button-row" id="check-new-row" style="display: none;">
                <button class="widget-load-more-button" id="checkNewBtn"></button>
                <button type="button" id="scroll-up-btn" class="scroll-arrow-btn" aria-label="Scroll up" title="Scroll up">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 19V5M5 12l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
            <button type="button" class="research-btn" id="reSearchBtn" style="display: none;"></button>
            <div id="loading" class="loading" style="display: none;"></div>
            <div id="error" class="error" style="display: none;"></div>
            <section class="card tips" id="tips-card">
                <h3 id="quickGuideTitle"></h3>
                <p id="quickGuideDescription"></p>
                <div class="search-info" id="searchInfo">
                    <p id="searchInfoText"></p>
                    <p id="deepCheckInfoText"></p>
                </div>
                <ul id="featuresList"></ul>
                <p class="github-link">GitHub: <a href="https://github.com/FranBarInstance/Telegram-Ban-Bypass" target="_blank">Telegram Ban Bypass</a></p>
            </section>
        </div>
    </main>
    <div class="for-caching" style="display: none;">
        <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-post="telegram/0" data-width="100%"></script>
    </div>
    <script src="app.js"></script>
</body>
</html>
